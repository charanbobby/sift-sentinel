[project]
name = "slice-2-notebook"
version = "0.1.0"
description = "Find Evil hackathon — Slice 2 notebook prototype (Extract/Plan/Execute/Interpret pipeline over our MCP server)"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.2",
    "openai>=1.54",
    "mcp>=1.2",
    "pydantic>=2.9",
    "langfuse>=2.55",
    "langgraph>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
